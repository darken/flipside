<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efdc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1b22" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="A daily todo notepad: flip the page to see what you finished."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flipside" />
    <title>Flipside</title>
    <script>
      // Applies the saved theme before the first paint, so there is no flash of the wrong one.
      try {
        var saved = JSON.parse(localStorage.getItem('flipside:settings:v1') || 'null');
        var theme = saved && saved.theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
          var color = theme === 'dark' ? '#1c1b22' : '#f6efdc';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].removeAttribute('media');
            metas[i].setAttribute('content', color);
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
